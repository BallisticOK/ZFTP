name: Release

# Push a tag like "v2.7.4" to build the installer and publish a GitHub Release
# with it attached, with release notes generated from the commits since the
# previous tag. `workflow_dispatch` lets you run the same pipeline manually
# (e.g. to test it) without needing a real tag.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 2.6.2) - only used for manual runs"
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history, needed to diff against the previous tag
          fetch-tags: true

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ github.event.inputs.version }}"
            $tagName = "v$version"
          } else {
            $tagName = "${{ github.ref_name }}"
            $version = $tagName.TrimStart("v")
          }

          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Release version must use major.minor.patch format (for example, 2.7.4)."
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag_name=$tagName" >> $env:GITHUB_OUTPUT

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Download WinFsp installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path prereqs | Out-Null
          $headers = @{ "User-Agent" = "ZFTP-CI" }
          if ($env:GITHUB_TOKEN) { $headers["Authorization"] = "Bearer $env:GITHUB_TOKEN" }
          $rel = Invoke-RestMethod -Uri "https://api.github.com/repos/winfsp/winfsp/releases/latest" -Headers $headers
          $asset = $rel.assets | Where-Object { $_.name -match '^winfsp-.*\.msi$' } | Select-Object -First 1
          if (-not $asset) { throw "Could not find a WinFsp .msi asset in the latest release." }
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "prereqs\winfsp.msi"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install WinFsp
        shell: pwsh
        run: |
          # Needed so ZFTP.Core's HintPath reference to winfsp-msil.dll resolves during build.
          $proc = Start-Process msiexec.exe -ArgumentList "/i", "$($pwd)\prereqs\winfsp.msi", "/quiet", "/qn", "/norestart" -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "WinFsp install failed with exit code $($proc.ExitCode)" }

      - name: Build custom installer
        shell: pwsh
        run: ./installer/build-installer.ps1 -Version "${{ steps.version.outputs.version }}"

      - name: Generate changelog
        id: changelog
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.tag_name }}"
          $prevTag = $null
          if ("${{ github.event_name }}" -eq "push") {
            $prevTag = git describe --tags --abbrev=0 "$tag^" 2>$null
            if ($LASTEXITCODE -ne 0) { $prevTag = $null }
          } else {
            $prevTag = git describe --tags --abbrev=0 2>$null
            if ($LASTEXITCODE -ne 0) { $prevTag = $null }
          }

          if ($prevTag) {
            $range = "$prevTag..HEAD"
          } else {
            $range = "-30" # first-ever release: just the most recent commits
          }
          $log = if ($range -eq "-30") { git log -30 --pretty=format:"%s|||%h" } else { git log $range --pretty=format:"%s|||%h" }

          $added = @(); $fixed = @(); $changed = @(); $other = @()
          foreach ($line in $log) {
            if (-not $line) { continue }
            $bits = $line -split '\|\|\|', 2
            $msg = $bits[0]; $hash = $bits[1]
            if ($msg -match '^\s*(feat|feature|add)(\(|:)') { $added += "- $msg ($hash)" }
            elseif ($msg -match '^\s*fix(\(|:)') { $fixed += "- $msg ($hash)" }
            elseif ($msg -match '^\s*(refactor|perf|chore|style|docs|build|ci)(\(|:)') { $changed += "- $msg ($hash)" }
            else { $other += "- $msg ($hash)" }
          }

          $body = "## ZFTP $tag`n`n"
          if ($added.Count)   { $body += "### Added`n" + ($added -join "`n") + "`n`n" }
          if ($fixed.Count)   { $body += "### Fixed`n" + ($fixed -join "`n") + "`n`n" }
          if ($changed.Count) { $body += "### Changed`n" + ($changed -join "`n") + "`n`n" }
          if ($other.Count)   { $body += "### Other`n" + ($other -join "`n") + "`n`n" }
          if (-not $prevTag)  { $body += "_Initial release._`n" }

          $body | Out-File -FilePath changelog.md -Encoding utf8

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: ZFTP ${{ steps.version.outputs.version }}
          body_path: changelog.md
          files: dist/ZFTP-Setup-*.exe
