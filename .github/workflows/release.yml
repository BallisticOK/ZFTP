name: Release

# One release tag produces permanent downloads for every supported platform.
# Example: v2.8.0
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (must match Directory.Build.props, e.g. 2.8.0)"
        required: true

permissions:
  contents: write

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag_name: ${{ steps.version.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Validate release version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version="${{ github.event.inputs.version }}"
            tag_name="v$version"
          else
            tag_name="${{ github.ref_name }}"
            version="${tag_name#v}"
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release version must use major.minor.patch format." >&2
            exit 1
          fi

          source_version="$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' Directory.Build.props | head -n 1)"
          if [[ "$source_version" != "$version" ]]; then
            echo "Release version $version does not match source version $source_version in Directory.Build.props." >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag_name=$tag_name" >> "$GITHUB_OUTPUT"

  windows-installer:
    needs: metadata
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Download WinFsp for the build environment
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path prereqs | Out-Null
          $headers = @{ "User-Agent" = "ZFTP-CI" }
          if ($env:GITHUB_TOKEN) { $headers["Authorization"] = "Bearer $env:GITHUB_TOKEN" }
          $rel = Invoke-RestMethod -Uri "https://api.github.com/repos/winfsp/winfsp/releases/latest" -Headers $headers
          $asset = $rel.assets | Where-Object { $_.name -match '^winfsp-.*\.msi$' } | Select-Object -First 1
          if (-not $asset) { throw "Could not find a WinFsp .msi asset in the latest release." }
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "prereqs\winfsp.msi"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install WinFsp for compilation
        shell: pwsh
        run: |
          $proc = Start-Process msiexec.exe -ArgumentList "/i", "$($pwd)\prereqs\winfsp.msi", "/quiet", "/qn", "/norestart" -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "WinFsp install failed with exit code $($proc.ExitCode)" }

      - name: Build Windows installer
        shell: pwsh
        run: ./installer/build-installer.ps1 -Version "${{ needs.metadata.outputs.version }}"

      - uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: dist/ZFTP-Setup-*.exe
          if-no-files-found: error

  linux-cli:
    needs: metadata
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            asset: zftp-linux-x64.bin
          - rid: linux-arm64
            asset: zftp-linux-arm64.bin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"
      - name: Publish ${{ matrix.rid }} CLI
        run: |
          version="${{ needs.metadata.outputs.version }}"
          dotnet publish src/ZFTP.Cli/ZFTP.Cli.csproj \
            -c Release -r "${{ matrix.rid }}" --self-contained true \
            -p:PublishSingleFile=true \
            -p:Version="$version" -p:FileVersion="$version.0" -p:AssemblyVersion="$version.0" \
            -o "dist/${{ matrix.rid }}"
          mkdir -p dist/release
          mv "dist/${{ matrix.rid }}/zftp" "dist/release/${{ matrix.asset }}"
          chmod +x "dist/release/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.rid }}
          path: dist/release/${{ matrix.asset }}
          if-no-files-found: error

  mac-gui:
    needs: metadata
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [osx-arm64, osx-x64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"
      - name: Build ${{ matrix.rid }} app bundle
        run: bash scripts/package-macos.sh "${{ matrix.rid }}" "${{ needs.metadata.outputs.version }}"
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.rid }}
          path: dist/ZFTP-macOS-*.zip
          if-no-files-found: error

  publish-release:
    needs: [metadata, windows-installer, linux-cli, mac-gui]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist/release
          merge-multiple: true

      - name: Add installer and checksums
        shell: bash
        run: |
          cp scripts/install-linux.sh dist/release/install-linux.sh
          chmod +x dist/release/install-linux.sh dist/release/zftp-linux-*.bin
          cd dist/release
          sha256sum ZFTP-Setup-*.exe zftp-linux-*.bin ZFTP-macOS-*.zip install-linux.sh > SHA256SUMS
          cat SHA256SUMS

      - name: Generate release notes
        shell: bash
        run: |
          tag="${{ needs.metadata.outputs.tag_name }}"
          version="${{ needs.metadata.outputs.version }}"
          previous="$(git tag --sort=-v:refname | grep -Fxv "$tag" | head -n 1 || true)"

          {
            echo "## ZFTP $version"
            echo
            echo "### Quick install"
            echo
            echo 'Linux x64 / ARM64:'
            echo '```bash'
            echo 'curl -fsSL https://github.com/BallisticOK/ZFTP/releases/latest/download/install-linux.sh | bash'
            echo '```'
            echo
            echo "The installer auto-detects CPU architecture, verifies the SHA-256 checksum, and installs \`zftp\` to \`~/.local/bin\`."
            echo
            echo "### Changes"
            echo
            if [[ -n "$previous" ]]; then
              git log "$previous..HEAD" --pretty='- %s (`%h`)'
            else
              git log -30 --pretty='- %s (`%h`)'
            fi
          } > release-notes.md

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ needs.metadata.outputs.tag_name }}"
          title="ZFTP ${{ needs.metadata.outputs.version }}"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" \
              --title "$title" --notes-file release-notes.md --latest
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "$title" --notes-file release-notes.md --latest
          fi

          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber \
            dist/release/ZFTP-Setup-*.exe \
            dist/release/zftp-linux-x64.bin \
            dist/release/zftp-linux-arm64.bin \
            dist/release/ZFTP-macOS-*.zip \
            dist/release/install-linux.sh \
            dist/release/SHA256SUMS

      - name: Verify required release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ needs.metadata.outputs.tag_name }}"
          assets="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          for required in \
            "ZFTP-Setup-${{ needs.metadata.outputs.version }}.exe" \
            zftp-linux-x64.bin zftp-linux-arm64.bin \
            ZFTP-macOS-x64.zip ZFTP-macOS-arm64.zip \
            install-linux.sh SHA256SUMS; do
            if ! grep -Fxq "$required" <<< "$assets"; then
              echo "Missing required release asset: $required" >&2
              exit 1
            fi
          done
