name: CI

# Compile-check on every push/PR: catches regressions in either half of the
# cross-platform split — the Windows WPF app/native mount engines, and the
# portable ZFTP.Core/ZFTP.Daemon slice used on Linux/macOS. This is a build
# smoke test only; it doesn't publish artifacts or run an actual mount (see
# the "cross-platform" branch's manual verification notes for that).
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet restore ZFTP.sln
      - run: dotnet build ZFTP.sln -c Debug --no-restore

  linux-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Publish ZFTP.Core (linux-x64)
        run: dotnet publish src/ZFTP.Core/ZFTP.Core.csproj -f net8.0 -r linux-x64 --self-contained false
      - name: Publish ZFTP.Daemon (linux-x64)
        run: dotnet publish src/ZFTP.Daemon/ZFTP.Daemon.csproj -f net8.0 -r linux-x64 --self-contained false
      - name: Publish ZFTP.App (linux-x64)
        run: dotnet publish src/ZFTP.App/ZFTP.App.csproj -f net8.0 -r linux-x64 --self-contained false

  macos-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Publish ZFTP.Core (osx-arm64)
        run: dotnet publish src/ZFTP.Core/ZFTP.Core.csproj -f net8.0 -r osx-arm64 --self-contained false
      - name: Publish ZFTP.Daemon (osx-arm64)
        run: dotnet publish src/ZFTP.Daemon/ZFTP.Daemon.csproj -f net8.0 -r osx-arm64 --self-contained false
      - name: Publish ZFTP.App (osx-arm64)
        run: dotnet publish src/ZFTP.App/ZFTP.App.csproj -f net8.0 -r osx-arm64 --self-contained false
